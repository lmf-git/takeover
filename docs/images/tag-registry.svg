<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" width="760" height="444" role="img" aria-label="define() calls become one registry with three consumers"><title>define() calls become one registry with three consumers</title><style>.bg{fill:#ffffff}.panel{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}.box{fill:#ffffff;stroke:#8c959f;stroke-width:1}.accent{fill:#eef0ff;stroke:#5a67d8;stroke-width:1.5}.edge{fill:none;stroke:#6e7781;stroke-width:1.25}.dash{fill:none;stroke:#d0d7de;stroke-width:1;stroke-dasharray:4 4}.head{fill:#6e7781}.badge{fill:#5a67d8}.badge-t{fill:#ffffff;font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.title{fill:#1f2328;font:600 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.sub{fill:#57606a;font:400 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.label{fill:#57606a;font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:.06em}.name{fill:#1f2328;font:600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.namem{fill:#1f2328;font:600 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.body{fill:#57606a;font:400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.mono{fill:#57606a;font:400 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.note{fill:#57606a;font:400 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}@media (prefers-color-scheme: dark){.bg{fill:#0d1117}.panel{fill:#161b22;stroke:#30363d;stroke-width:1}.box{fill:#0d1117;stroke:#6e7681;stroke-width:1}.accent{fill:#1d2142;stroke:#8b96ff;stroke-width:1.5}.edge{fill:none;stroke:#8b949e;stroke-width:1.25}.dash{fill:none;stroke:#30363d;stroke-width:1;stroke-dasharray:4 4}.head{fill:#8b949e}.badge{fill:#8b96ff}.badge-t{fill:#0d1117;font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.title{fill:#e6edf3;font:600 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.sub{fill:#9da7b3;font:400 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.label{fill:#9da7b3;font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:.06em}.name{fill:#e6edf3;font:600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.namem{fill:#e6edf3;font:600 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.body{fill:#9da7b3;font:400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.mono{fill:#9da7b3;font:400 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.note{fill:#9da7b3;font:400 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker></defs><rect width="760" height="444" class="bg"/><text x="24" y="36" class="title">define() calls become one registry with three consumers</text><text x="24" y="56" class="sub">scanTags() rebuilds it on every dev change and every build; nothing is configured by hand.</text><rect x="24" y="76" width="236" height="224" rx="10" class="panel"/><text x="38" y="97" class="label">SOURCE FILES</text><g><rect x="36" y="104" width="212" height="52" rx="8" class="box"/><text x="48" y="125" class="namem">components/HomeCTA/</text><text x="48" y="142.5" class="mono">define('home-cta', …)</text></g><g><rect x="36" y="168" width="212" height="52" rx="8" class="box"/><text x="48" y="189" class="namem">app/NotFound/</text><text x="48" y="206.5" class="mono">define('notfound-page', …)</text></g><g><rect x="36" y="232" width="212" height="52" rx="8" class="box"/><text x="48" y="253" class="namem">app/_Layout/</text><text x="48" y="270.5" class="mono">define('app-layout', …)</text></g><path d="M248 130H272M248 194H272M248 258H272" class="edge"/><path d="M272 258V126H282" class="edge" marker-end="url(#arrow)"/><g><rect x="284" y="92" width="260" height="68" rx="8" class="box"/><text x="296" y="113" class="namem">scanTags()</text><text x="296" y="130.5" class="mono">core/scan.js</text><text x="296" y="147" class="body">greps app/ and components/</text></g><path d="M414 160V186" class="edge" marker-end="url(#arrow)"/><g><rect x="284" y="188" width="260" height="104" rx="8" class="accent"/><text x="296" y="209" class="name">Registry: tag → source file</text><text x="296" y="226.5" class="mono">app-logo → components/Logo/Logo</text><text x="296" y="243" class="mono">home-cta → …/HomeCTA/HomeCTA</text><text x="296" y="259.5" class="mono">app-layout → app/_Layout/_Layout</text><text x="296" y="276" class="body">… one entry per define(), sorted</text></g><path d="M544 240H556M556 126V282" class="edge"/><path d="M556 126H566" class="edge" marker-end="url(#arrow)"/><path d="M556 204H566" class="edge" marker-end="url(#arrow)"/><path d="M556 282H566" class="edge" marker-end="url(#arrow)"/><g><rect x="568" y="92" width="168" height="68" rx="8" class="box"/><text x="580" y="113" class="name">Browser loader</text><text x="580" y="130.5" class="mono">window.__TAGS__</text><text x="580" y="147" class="body">inlined in the HTML</text></g><g><rect x="568" y="170" width="168" height="68" rx="8" class="box"/><text x="580" y="191" class="name">Node SSR</text><text x="580" y="208.5" class="mono">entry-server.js</text><text x="580" y="225" class="body">calls scanComponents()</text></g><g><rect x="568" y="248" width="168" height="68" rx="8" class="box"/><text x="580" y="269" class="name">Cloudflare worker</text><text x="580" y="286.5" class="mono">_ssr-config.json</text><text x="580" y="303" class="body">written by the build</text></g><path d="M652 316V346" class="edge" marker-end="url(#arrow)"/><text x="644" y="336" class="note" text-anchor="end">all resolve through</text><g><rect x="24" y="348" width="712" height="72" rx="8" class="box"/><text x="36" y="369" class="namem">core/tags.js</text><text x="36" y="386.5" class="mono">pathsForTag('home-cta') → components/HomeCTA/HomeCTA + .js · .html · .module.css · .css</text><text x="36" y="403" class="body">Not in the registry? Convention: drop app-, PascalCase the rest (&lt;app-logo&gt; → components/Logo)</text></g></svg>
