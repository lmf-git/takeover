<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 778" width="760" height="778" role="img" aria-label="One renderer core, three hosts, one HTML contract"><title>One renderer core, three hosts, one HTML contract</title><style>.bg{fill:#ffffff}.panel{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}.box{fill:#ffffff;stroke:#8c959f;stroke-width:1}.accent{fill:#eef0ff;stroke:#5a67d8;stroke-width:1.5}.edge{fill:none;stroke:#6e7781;stroke-width:1.25}.dash{fill:none;stroke:#d0d7de;stroke-width:1;stroke-dasharray:4 4}.head{fill:#6e7781}.badge{fill:#5a67d8}.badge-t{fill:#ffffff;font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.title{fill:#1f2328;font:600 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.sub{fill:#57606a;font:400 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.label{fill:#57606a;font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:.06em}.name{fill:#1f2328;font:600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.namem{fill:#1f2328;font:600 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.body{fill:#57606a;font:400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.mono{fill:#57606a;font:400 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.note{fill:#57606a;font:400 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}@media (prefers-color-scheme: dark){.bg{fill:#0d1117}.panel{fill:#161b22;stroke:#30363d;stroke-width:1}.box{fill:#0d1117;stroke:#6e7681;stroke-width:1}.accent{fill:#1d2142;stroke:#8b96ff;stroke-width:1.5}.edge{fill:none;stroke:#8b949e;stroke-width:1.25}.dash{fill:none;stroke:#30363d;stroke-width:1;stroke-dasharray:4 4}.head{fill:#8b949e}.badge{fill:#8b96ff}.badge-t{fill:#0d1117;font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.title{fill:#e6edf3;font:600 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.sub{fill:#9da7b3;font:400 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.label{fill:#9da7b3;font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:.06em}.name{fill:#e6edf3;font:600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.namem{fill:#e6edf3;font:600 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.body{fill:#9da7b3;font:400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.mono{fill:#9da7b3;font:400 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.note{fill:#9da7b3;font:400 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker></defs><rect width="760" height="778" class="bg"/><text x="24" y="36" class="title">One renderer core, three hosts, one HTML contract</text><text x="24" y="56" class="sub">Hosts only do I/O. Locale choice, routing, tag lookup and rendering are shared code.</text><rect x="24" y="76" width="712" height="112" rx="10" class="panel"/><text x="38" y="97" class="label">SOURCE TREE (YOU EDIT)</text><g><rect x="40" y="108" width="161" height="64" rx="8" class="box"/><text x="52" y="129" class="namem">app/</text><text x="52" y="146.5" class="body">one folder per page</text><text x="52" y="163" class="body">Name.html + class</text></g><g><rect x="213" y="108" width="161" height="64" rx="8" class="box"/><text x="225" y="129" class="namem">components/</text><text x="225" y="146.5" class="body">shared elements</text><text x="225" y="163" class="body">template, class, CSS</text></g><g><rect x="386" y="108" width="161" height="64" rx="8" class="box"/><text x="398" y="129" class="namem">locales/</text><text x="398" y="146.5" class="body">*.json catalogues</text><text x="398" y="163" class="body">+ app.config.yml</text></g><g><rect x="559" y="108" width="161" height="64" rx="8" class="box"/><text x="571" y="129" class="namem">index.html</text><text x="571" y="146.5" class="body">shell, 5 placeholders</text><text x="571" y="163" class="body">+ globals.css</text></g><path d="M380 188V216" class="edge" marker-end="url(#arrow)"/><text x="390" y="206" class="note">read by</text><rect x="24" y="218" width="712" height="112" rx="10" class="panel"/><text x="38" y="239" class="label">SERVER HOSTS (I/O ONLY)</text><g><rect x="40" y="250" width="218" height="64" rx="8" class="box"/><text x="52" y="271" class="name">Node server</text><text x="52" y="288.5" class="mono">core/server/index.js</text><text x="52" y="305" class="body">yarn dev, yarn start</text></g><g><rect x="271" y="250" width="218" height="64" rx="8" class="box"/><text x="283" y="271" class="name">Netlify function</text><text x="283" y="288.5" class="mono">deploy/netlify/…/ssr.mjs</text><text x="283" y="305" class="body">imports dist/server</text></g><g><rect x="502" y="250" width="218" height="64" rx="8" class="box"/><text x="514" y="271" class="name">Cloudflare worker</text><text x="514" y="288.5" class="mono">dist/client/_worker.js</text><text x="514" y="305" class="body">files via env.ASSETS</text></g><path d="M380 330V358" class="edge" marker-end="url(#arrow)"/><text x="390" y="348" class="note">call</text><rect x="24" y="360" width="712" height="112" rx="10" class="panel"/><text x="38" y="381" class="label">SHARED CORE (SAME CODE ON EVERY HOST)</text><g><rect x="40" y="392" width="161" height="64" rx="8" class="box"/><text x="52" y="413" class="namem">core/locale.js</text><text x="52" y="430.5" class="mono">negotiateLocale()</text><text x="52" y="447" class="body">cookie, then header</text></g><g><rect x="213" y="392" width="161" height="64" rx="8" class="box"/><text x="225" y="413" class="namem">core/routes.js</text><text x="225" y="430.5" class="mono">matchRoute()</text><text x="225" y="447" class="body">exact, dynamic, 404</text></g><g><rect x="386" y="392" width="161" height="64" rx="8" class="box"/><text x="398" y="413" class="namem">core/tags.js</text><text x="398" y="430.5" class="body">tag → folder</text><text x="398" y="447" class="body">discovered registry</text></g><g><rect x="559" y="392" width="161" height="64" rx="8" class="box"/><text x="571" y="413" class="namem">core/server/ssr.js</text><text x="571" y="430.5" class="mono">createRenderer()</text><text x="571" y="447" class="body">templates → DSD HTML</text></g><path d="M380 472V500" class="edge" marker-end="url(#arrow)"/><text x="390" y="490" class="note">emits</text><g><rect x="24" y="502" width="712" height="92" rx="8" class="accent"/><text x="36" y="523" class="name">HTML response</text><text x="36" y="540.5" class="mono">&lt;tag&gt;&lt;template shadowrootmode=&quot;open&quot;&gt;…&lt;/template&gt;&lt;/tag&gt;  for each server-rendered element</text><text x="36" y="557" class="mono">__INITIAL_STATE__ · __LOCALES__ · __LOCALE_CONFIG__ · __ROUTES__ · __TAGS__</text><text x="36" y="573.5" class="body">Production adds __M__ and the whole core bundle, inline.</text></g><path d="M380 594V622" class="edge" marker-end="url(#arrow)"/><text x="390" y="612" class="note">boots</text><rect x="24" y="624" width="712" height="130" rx="10" class="panel"/><text x="38" y="645" class="label">BROWSER</text><g><rect x="40" y="656" width="218" height="82" rx="8" class="box"/><text x="52" y="677" class="name">Core bundle</text><text x="52" y="694.5" class="mono">entry-client.js</text><text x="52" y="711" class="body">seeds the store, inits locale,</text><text x="52" y="727.5" class="body">defines first-paint elements</text></g><g><rect x="271" y="656" width="218" height="82" rx="8" class="box"/><text x="283" y="677" class="namem">&lt;app-router&gt;</text><text x="283" y="694.5" class="body">hydrates the SSR page or</text><text x="283" y="711" class="body">renders the route; imports</text><text x="283" y="727.5" class="body">page modules from app/</text></g><g><rect x="502" y="656" width="218" height="82" rx="8" class="box"/><text x="514" y="677" class="namem">core/loader.js</text><text x="514" y="694.5" class="body">after load: imports the other</text><text x="514" y="711" class="body">components; lazy ones as</text><text x="514" y="727.5" class="body">they near the viewport</text></g></svg>
