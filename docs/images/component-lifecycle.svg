<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="760" height="700" role="img" aria-label="A server-rendered component is bound, not re-rendered"><title>A server-rendered component is bound, not re-rendered</title><style>.bg{fill:#ffffff}.panel{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}.box{fill:#ffffff;stroke:#8c959f;stroke-width:1}.accent{fill:#eef0ff;stroke:#5a67d8;stroke-width:1.5}.edge{fill:none;stroke:#6e7781;stroke-width:1.25}.dash{fill:none;stroke:#d0d7de;stroke-width:1;stroke-dasharray:4 4}.head{fill:#6e7781}.badge{fill:#5a67d8}.badge-t{fill:#ffffff;font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.title{fill:#1f2328;font:600 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.sub{fill:#57606a;font:400 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.label{fill:#57606a;font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:.06em}.name{fill:#1f2328;font:600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.namem{fill:#1f2328;font:600 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.body{fill:#57606a;font:400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.mono{fill:#57606a;font:400 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.note{fill:#57606a;font:400 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}@media (prefers-color-scheme: dark){.bg{fill:#0d1117}.panel{fill:#161b22;stroke:#30363d;stroke-width:1}.box{fill:#0d1117;stroke:#6e7681;stroke-width:1}.accent{fill:#1d2142;stroke:#8b96ff;stroke-width:1.5}.edge{fill:none;stroke:#8b949e;stroke-width:1.25}.dash{fill:none;stroke:#30363d;stroke-width:1;stroke-dasharray:4 4}.head{fill:#8b949e}.badge{fill:#8b96ff}.badge-t{fill:#0d1117;font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.title{fill:#e6edf3;font:600 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.sub{fill:#9da7b3;font:400 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.label{fill:#9da7b3;font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:.06em}.name{fill:#e6edf3;font:600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.namem{fill:#e6edf3;font:600 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.body{fill:#9da7b3;font:400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.mono{fill:#9da7b3;font:400 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.note{fill:#9da7b3;font:400 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker></defs><rect width="760" height="700" class="bg"/><text x="24" y="36" class="title">A server-rendered component is bound, not re-rendered</text><text x="24" y="56" class="sub">Left: connectedCallback(). Right: update(), which every re-render runs.</text><g><rect x="74" y="76" width="280" height="36" rx="8" class="box"/><text x="214" y="97" class="namem" text-anchor="middle">connectedCallback()</text></g><path d="M214 112V126" class="edge" marker-end="url(#arrow)"/><g><rect x="74" y="128" width="280" height="52" rx="8" class="box"/><text x="86" y="149" class="name">Load the template</text><text x="86" y="166.5" class="body">static template, else fetch templateUrl</text></g><path d="M214 180V194" class="edge" marker-end="url(#arrow)"/><g><rect x="74" y="196" width="280" height="68" rx="8" class="box"/><text x="86" y="217" class="name">Resolve CSS, first match wins</text><text x="86" y="234.5" class="body">inlined text, cssModule, css,</text><text x="86" y="251" class="body">sibling .module.css, sibling .css</text></g><path d="M214 264V278" class="edge" marker-end="url(#arrow)"/><g><rect x="74" y="280" width="280" height="36" rx="8" class="box"/><text x="214" y="301" class="namem" text-anchor="middle">store.setMeta(metadata)</text></g><path d="M214 316V330" class="edge" marker-end="url(#arrow)"/><polygon points="84,372 214,332 344,372 214,412" class="box"/><text x="214" y="369" class="name" text-anchor="middle">Shadow root already there?</text><text x="214" y="386" class="note" text-anchor="middle">it was server-rendered</text><path d="M84 372H60V438" class="edge" marker-end="url(#arrow)"/><text x="36" y="410" class="note">yes</text><path d="M344 372H368V438" class="edge" marker-end="url(#arrow)"/><text x="376" y="410" class="note">no</text><g><rect x="24" y="440" width="184" height="52" rx="8" class="box"/><text x="36" y="461" class="name">Hydrate</text><text x="36" y="478.5" class="body">bind() events, no render</text></g><g><rect x="220" y="440" width="184" height="52" rx="8" class="box"/><text x="232" y="461" class="name">Render</text><text x="232" y="478.5" class="body">attachShadow(), update()</text></g><path d="M116 492V522" class="edge" marker-end="url(#arrow)"/><path d="M312 492V522" class="edge" marker-end="url(#arrow)"/><g><rect x="74" y="524" width="280" height="68" rx="8" class="box"/><text x="86" y="545" class="name">Subscribe to the store</text><text x="86" y="562.5" class="body">static store keys, plus messages</text><text x="86" y="579" class="body">when the template mentions t.</text></g><path d="M214 592V606" class="edge" marker-end="url(#arrow)"/><g><rect x="74" y="608" width="280" height="68" rx="8" class="box"/><text x="86" y="629" class="name">Hydrated only</text><text x="86" y="646.5" class="body">mount(), then update() if the</text><text x="86" y="663" class="body">store differs from the snapshot</text></g><rect x="436" y="76" width="300" height="480" rx="10" class="panel"/><text x="450" y="97" class="label">EVERY RE-RENDER RUNS update()</text><g><rect x="452" y="108" width="268" height="36" rx="8" class="box"/><circle cx="472" cy="126" r="10" class="badge"/><text x="472" y="130" class="badge-t" text-anchor="middle">1</text><text x="492" y="130.5" class="body">Save focus and text selection</text></g><g><rect x="452" y="154" width="268" height="36" rx="8" class="box"/><circle cx="472" cy="172" r="10" class="badge"/><text x="472" y="176" class="badge-t" text-anchor="middle">2</text><text x="492" y="176.5" class="body">Abort the last AbortController</text></g><g><rect x="452" y="200" width="268" height="36" rx="8" class="box"/><circle cx="472" cy="218" r="10" class="badge"/><text x="472" y="222" class="badge-t" text-anchor="middle">3</text><text x="492" y="222.5" class="body">Render template into innerHTML</text></g><g><rect x="452" y="246" width="268" height="36" rx="8" class="box"/><circle cx="472" cy="264" r="10" class="badge"/><text x="472" y="268" class="badge-t" text-anchor="middle">4</text><text x="492" y="268.5" class="body">Apply :prop bindings</text></g><g><rect x="452" y="292" width="268" height="36" rx="8" class="box"/><circle cx="472" cy="310" r="10" class="badge"/><text x="472" y="314" class="badge-t" text-anchor="middle">5</text><text x="492" y="314.5" class="body">Wire @event attributes, bind()</text></g><g><rect x="452" y="338" width="268" height="36" rx="8" class="box"/><circle cx="472" cy="356" r="10" class="badge"/><text x="472" y="360" class="badge-t" text-anchor="middle">6</text><text x="492" y="360.5" class="body">Restore focus and selection</text></g><g><rect x="452" y="384" width="268" height="36" rx="8" class="box"/><circle cx="472" cy="402" r="10" class="badge"/><text x="472" y="406" class="badge-t" text-anchor="middle">7</text><text x="492" y="406.5" class="body">Call mount()</text></g><rect x="452" y="436" width="268" height="104" rx="8" class="box"/><text x="464" y="457" class="label">TRIGGERED BY</text><text x="464" y="478" class="note">a local write (when reactive)</text><text x="464" y="494.5" class="note">a subscribed store key change</text><text x="464" y="511" class="note">the hydration drift check</text><text x="464" y="527.5" class="note">a direct this.update() call</text><path d="M404 466H434" class="edge" marker-end="url(#arrow)"/><text x="410" y="458" class="note">runs</text><path d="M354 642H586V558" class="edge" marker-end="url(#arrow)"/><text x="470" y="634" class="note">if drifted</text></svg>
