<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Title + description are injected per route at the head-meta placeholder below:
       SSR fills it from the matched route's metadata; the CSR build bakes in home's. -->
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <!--inline-css-->
  <!--preload-links-->
  <!--head-meta-->
  <!--initial-state-->
  <script type="module" src="/core/server/entry-client.js"></script>
</head>
<body>
  <app-layout data-ssr>
    <!--app-html-->
  </app-layout>
  <script>
    if (history.scrollRestoration) history.scrollRestoration = 'manual';
    addEventListener('beforeunload', function() {
      sessionStorage.setItem('__scroll__', JSON.stringify({
        path: location.pathname, x: scrollX, y: scrollY
      }));
    });
  </script>
</body>
</html>
