<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 552" width="760" height="552" role="img" aria-label="The page is complete HTML before any script runs"><title>The page is complete HTML before any script runs</title><style>.bg{fill:#ffffff}.panel{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}.box{fill:#ffffff;stroke:#8c959f;stroke-width:1}.accent{fill:#eef0ff;stroke:#5a67d8;stroke-width:1.5}.edge{fill:none;stroke:#6e7781;stroke-width:1.25}.dash{fill:none;stroke:#d0d7de;stroke-width:1;stroke-dasharray:4 4}.head{fill:#6e7781}.badge{fill:#5a67d8}.badge-t{fill:#ffffff;font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.title{fill:#1f2328;font:600 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.sub{fill:#57606a;font:400 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.label{fill:#57606a;font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:.06em}.name{fill:#1f2328;font:600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.namem{fill:#1f2328;font:600 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.body{fill:#57606a;font:400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.mono{fill:#57606a;font:400 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.note{fill:#57606a;font:400 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}@media (prefers-color-scheme: dark){.bg{fill:#0d1117}.panel{fill:#161b22;stroke:#30363d;stroke-width:1}.box{fill:#0d1117;stroke:#6e7681;stroke-width:1}.accent{fill:#1d2142;stroke:#8b96ff;stroke-width:1.5}.edge{fill:none;stroke:#8b949e;stroke-width:1.25}.dash{fill:none;stroke:#30363d;stroke-width:1;stroke-dasharray:4 4}.head{fill:#8b949e}.badge{fill:#8b96ff}.badge-t{fill:#0d1117;font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.title{fill:#e6edf3;font:600 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.sub{fill:#9da7b3;font:400 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.label{fill:#9da7b3;font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:.06em}.name{fill:#e6edf3;font:600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.namem{fill:#e6edf3;font:600 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.body{fill:#9da7b3;font:400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.mono{fill:#9da7b3;font:400 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.note{fill:#9da7b3;font:400 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker></defs><rect width="760" height="552" class="bg"/><text x="24" y="36" class="title">The page is complete HTML before any script runs</text><text x="24" y="56" class="sub">Left: what a host does per request. Right: what the browser does with the response.</text><rect x="24" y="76" width="340" height="452" rx="10" class="panel"/><text x="38" y="97" class="label">SERVER, PER REQUEST</text><rect x="396" y="76" width="340" height="452" rx="10" class="panel"/><text x="410" y="97" class="label">BROWSER</text><g><rect x="40" y="108" width="308" height="36" rx="8" class="box"/><circle cx="60" cy="126" r="10" class="badge"/><text x="60" y="130" class="badge-t" text-anchor="middle">1</text><text x="80" y="130.5" class="body">Serve files; a missing one is a 404</text></g><g><rect x="40" y="154" width="308" height="36" rx="8" class="box"/><circle cx="60" cy="172" r="10" class="badge"/><text x="60" y="176" class="badge-t" text-anchor="middle">2</text><text x="80" y="176.5" class="body">Pick locale: cookie, header, default</text></g><g><rect x="40" y="200" width="308" height="36" rx="8" class="box"/><circle cx="60" cy="218" r="10" class="badge"/><text x="60" y="222" class="badge-t" text-anchor="middle">3</text><text x="80" y="222.5" class="body">Load active and other catalogues</text></g><g><rect x="40" y="246" width="308" height="36" rx="8" class="box"/><circle cx="60" cy="264" r="10" class="badge"/><text x="60" y="268" class="badge-t" text-anchor="middle">4</text><text x="80" y="268.5" class="body">Match route: exact, dynamic, 404</text></g><g><rect x="40" y="292" width="308" height="36" rx="8" class="box"/><circle cx="60" cy="310" r="10" class="badge"/><text x="60" y="314" class="badge-t" text-anchor="middle">5</text><text x="80" y="314.5" class="body">requiresAuth? Redirect to /login</text></g><g><rect x="40" y="338" width="308" height="36" rx="8" class="box"/><circle cx="60" cy="356" r="10" class="badge"/><text x="60" y="360" class="badge-t" text-anchor="middle">6</text><text x="80" y="360.5" class="body">Build props: state, local, ssrProps</text></g><g><rect x="40" y="384" width="308" height="36" rx="8" class="box"/><circle cx="60" cy="402" r="10" class="badge"/><text x="60" y="406" class="badge-t" text-anchor="middle">7</text><text x="80" y="406.5" class="body">Render layout, page, nested tags</text></g><g><rect x="40" y="430" width="308" height="36" rx="8" class="box"/><circle cx="60" cy="448" r="10" class="badge"/><text x="60" y="452" class="badge-t" text-anchor="middle">8</text><text x="80" y="452.5" class="body">Splice page into #outlet, wrap DSD</text></g><g><rect x="40" y="476" width="308" height="36" rx="8" class="box"/><circle cx="60" cy="494" r="10" class="badge"/><text x="60" y="498" class="badge-t" text-anchor="middle">9</text><text x="80" y="498.5" class="body">Fill the shell, send 200 or 404</text></g><g><rect x="412" y="108" width="308" height="36" rx="8" class="box"/><circle cx="432" cy="126" r="10" class="badge"/><text x="432" y="130" class="badge-t" text-anchor="middle">1</text><text x="452" y="130.5" class="body">Parse: DSD becomes shadow roots</text></g><path d="M412 168H473.65M658.35 168H720" class="dash"/><text x="566" y="172" class="note" text-anchor="middle">inline core bundle executes</text><g><rect x="412" y="192" width="308" height="36" rx="8" class="box"/><circle cx="432" cy="210" r="10" class="badge"/><text x="432" y="214" class="badge-t" text-anchor="middle">2</text><text x="452" y="214.5" class="body">Store seeded from the snapshot</text></g><g><rect x="412" y="242" width="308" height="36" rx="8" class="box"/><circle cx="432" cy="260" r="10" class="badge"/><text x="432" y="264" class="badge-t" text-anchor="middle">3</text><text x="452" y="264.5" class="body">Eager elements bind, no re-render</text></g><g><rect x="412" y="292" width="308" height="36" rx="8" class="box"/><circle cx="432" cy="310" r="10" class="badge"/><text x="432" y="314" class="badge-t" text-anchor="middle">4</text><text x="452" y="314.5" class="body">Head sync, initLocale(), scroll</text></g><g><rect x="412" y="342" width="308" height="36" rx="8" class="box"/><circle cx="432" cy="360" r="10" class="badge"/><text x="432" y="364" class="badge-t" text-anchor="middle">5</text><text x="452" y="364.5" class="body">Router hydrates the page</text></g><path d="M412 402H470.6M661.4 402H720" class="dash"/><text x="566" y="406" class="note" text-anchor="middle">after window load, when idle</text><g><rect x="412" y="426" width="308" height="36" rx="8" class="box"/><circle cx="432" cy="444" r="10" class="badge"/><text x="432" y="448" class="badge-t" text-anchor="middle">6</text><text x="452" y="448.5" class="body">Loader imports others; lazy near view</text></g><g><rect x="412" y="476" width="308" height="36" rx="8" class="box"/><circle cx="432" cy="494" r="10" class="badge"/><text x="432" y="498" class="badge-t" text-anchor="middle">7</text><text x="452" y="498.5" class="body">Observers catch later elements</text></g><path d="M348 494H388V126H410" class="edge" marker-end="url(#arrow)"/><text x="382" y="300" class="note" text-anchor="middle" transform="rotate(-90 382 300)">HTML response</text></svg>
