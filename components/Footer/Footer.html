<!-- Styles live in a sibling CSS Module, so class names come from $css rather than
     being written literally. Note this comment ships in the SSR response and is
     itself expression-substituted, so keep template syntax out of it. -->
<footer>
  <div class="{{$css.inner}}">
    <div class="{{$css.brand}}">
      <app-logo style="--logo-size:22px"></app-logo>
      <span class="{{$css.version}}">takeover@1.0.0</span>
    </div>
    <span class="{{$css.dot}}">·</span>
    <span class="{{$css.built}}">{{t.footer.built}}</span>
    <div class="{{$css.spacer}}"></div>
    <span class="{{$css.mit}}">{{t.footer.mit}}</span>
  </div>
</footer>
