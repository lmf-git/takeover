Font, 'Segoe UI', Helvetica, Arial, sans-serif}.title{fill:#e6edf3;font:600 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.sub{fill:#9da7b3;font:400 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.label{fill:#9da7b3;font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:.06em}.name{fill:#e6edf3;font:600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.namem{fill:#e6edf3;font:600 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.body{fill:#9da7b3;font:400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.mono{fill:#9da7b3;font:400 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.note{fill:#9da7b3;font:400 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker></defs><rect width="760" height="562" class="bg"/><text x="24" y="36" class="title">yarn build: one pass from source to two output trees</text><text x="24" y="56" class="sub">Left: what is read. Middle: what core/server/build.js does. Right: what the hosts read.</text><rect x="24" y="76" width="184" height="332" rx="10" class="panel"/><text x="38" y="97" class="label">SOURCE</text><g><rect x="36" y="104" width="160" height="48" rx="8" class="box"/><text x="48" y="125" class="namem">entry-client.js</text><text x="48" y="142.5" class="body">plus static imports</text></g><g><rect x="36" y="164" width="160" height="48" rx="8" class="box"/><text x="48" y="185" class="namem">app/ components/</text><text x="48" y="202.5" class="body">pages, components</text></g><g><rect x="36" y="224" width="160" height="48" rx="8" class="box"/><text x="48" y="245" class="namem">core/ lib/</text><text x="48" y="262.5" class="body">framework, helpers</text></g><g><rect x="36" y="284" width="160" height="48" rx="8" class="box"/><text x="48" y="305" class="namem">index.html</text><text x="48" y="322.5" class="body">plus globals.css</text></g><g><rect x="36" y="344" width="160" height="48" rx="8" class="box"/><text x="48" y="365" class="namem">locales/ public/</text><text x="48" y="382.5" class="body">plus app.config.yml</text></g><path d="M208 256H230" class="edge" marker-end="url(#arrow)"/><rect x="232" y="76" width="288" height="360" rx="10" class="panel"/><text x="246" y="97" class="label">BUILD.JS, IN ORDER</text><g><rect x="248" y="104" width="256" height="28" rx="8" class="box"/><circle cx="268" cy="118" r="10" class="badge"/><text x="268" y="122" class="badge-t" text-anchor="middle">1</text><text x="288" y="122.5" class="body">Bundle the entry graph (IIFE)</text></g><g><rect x="248" y="136" width="256" height="28" rx="8" class="box"/><circle cx="268" cy="150" r="10" class="badge"/><text x="268" y="154" class="badge-t" text-anchor="middle">2</text><text x="288" y="154.5" class="body">Copy, minify, imports → __r()</text></g><g><rect x="248" y="168" width="256" height="28" rx="8" class="box"/><circle cx="268" cy="182" r="10" class="badge"/><text x="268" y="186" class="badge-t" text-anchor="middle">3</text><text x="288" y="186.5" class="body">Extract inline &lt;script&gt; blocks</text></g><g><rect x="248" y="200" width="256" height="28" rx="8" class="box"/><circle cx="268" cy="214" r="10" class="badge"/><text x="268" y="218" class="badge-t" text-anchor="middle">4</text><text x="288" y="218.5" class="body">Hash app/ + components/ → __M__</text></g><g><rect x="248" y="232" width="256" height="28" rx="8" class="box"/><circle cx="268" cy="246" r="10" class="badge"/><text x="268" y="250" class="badge-t" text-anchor="middle">5</text><text x="288" y="250.5" class="body">Write routes.json</text></g><g><rect x="248" y="264" width="256" height="28" rx="8" class="box"/><circle cx="268" cy="278" r="10" class="badge"/><text x="268" y="282" class="badge-t" text-anchor="middle">6</text><text x="288" y="282.5" class="body">Write _template.html (SSR)</text></g><g><rect x="248" y="296" width="256" height="28" rx="8" class="box"/><circle cx="268" cy="310" r="10" class="badge"/><text x="268" y="314" class="badge-t" text-anchor="middle">7</text><text x="288" y="314.5" class="body">Write index.html (CSR)</text></g><g><rect x="248" y="328" width="256" height="28" rx="8" class="box"/><circle cx="268" cy="342" r="10" class="badge"/><text x="268" y="346" class="badge-t" text-anchor="middle">8</text><text x="288" y="346.5" class="body">Copy locales, public/, worker</text></g><g><rect x="248" y="360" width="256" height="28" rx="8" class="box"/><circle cx="268" cy="374" r="10" class="badge"/><text x="268" y="378" class="badge-t" text-anchor="middle">9</text><text x="288" y="378.5" class="body">Write _ssr-config.json</text></g><g><rect x="248" y="392" width="256" height="28" rx="8" class="box"/><circle cx="268" cy="406" r="10" class="badge"/><text x="268" y="410" class="badge-t" text-anchor="middle">10</text><text x="288" y="410.5" class="body">Copy server tree as .mjs</text></g><path d="M520 168H542" class="edge" marker-end="url(#arrow)"/><path d="M520 336H542" class="edge" marker-end="url(#arrow)"/><rect x="544" y="76" width="192" height="184" rx="10" class="panel"/><text x="558" y="97" class="label">DIST/CLIENT (SERVED)</text><text x="558" y="120" class="mono">_template.html</text><text x="558" y="136" class="mono">index.html</text><text x="558" y="152" class="mono">app/**.&lt;hash&gt;.js</text><text x="558" y="168" class="mono">components/**.&lt;hash&gt;.js</text><text x="558" y="184" class="mono">core/ lib/ (minified)</text><text x="558" y="200" class="mono">routes.json</text><text x="558" y="216" class="mono">_ssr-config.json</text><text x="558" y="232" class="mono">_worker.js</text><text x="558" y="248" class="mono">locales/ fonts/</text><rect x="544" y="276" width="192" height="120" rx="10" class="panel"/><text x="558" y="297" class="label">DIST/SERVER (SSR)</text><text x="558" y="320" class="mono">core/ lib/ as .mjs</text><text x="558" y="336" class="mono">app/ components/</text><text x="558" y="352" class="mono">locales/</text><text x="558" y="368" class="mono">app.config.yml</text><text x="558" y="384" class="mono">_assets-manifest.json</text><path d="M640 396V444H136" class="edge"/><path d="M136 444V466" class="edge" marker-end="url(#arrow)"/><path d="M380 444V466" class="edge" marker-end="url(#arrow)"/><path d="M624 444V466" class="edge" marker-end="url(#arrow)"/><text x="160" y="438" class="note">deployed to</text><g><rect x="24" y="468" width="224" height="70" rx="8" class="box"/><text x="36" y="489" class="name">Netlify</text><text x="36" y="506.5" class="body">files from dist/client,</text><text x="36" y="523" class="body">function renders from dist/server</text></g><g><rect x="268" y="468" width="224" height="70" rx="8" class="box"/><text x="280" y="489" class="name">Static host</text><text x="280" y="506.5" class="body">index.html plus an SPA</text><text x="280" y="523" class="body">rewrite; no server rendering</text></g><g><rect x="512" y="468" width="224" height="70" rx="8" class="box"/><text x="524" y="489" class="name">Cloudflare Pages</text><text x="524" y="506.5" class="body">_worker.js renders,</text><text x="524" y="523" class="body">env.ASSETS serves files</text></g></svg>
